<script>
  // Set initial Giscus theme based on current site theme
  function getGiscusTheme() {
    const theme = document.querySelector("html").dataset.theme;
    return theme === "dark" ? "dark_dimmed" : "light";
  }
</script>

<script src="https://giscus.app/client.js"
        data-repo="C21-github/C21-github.github.io"

<script>
  // Update Giscus theme when site theme changes
  function updateGiscusTheme() {
    const iframe = document.querySelector('iframe.giscus-frame');
    if (!iframe) return;
    
    const theme = getGiscusTheme();
    iframe.contentWindow.postMessage(
      { giscus: { setConfig: { theme: theme } } },
      'https://giscus.app'
    );
  }

  // Watch for theme changes on the html element
  const observer = new MutationObserver((mutations) => {
    mutations.forEach((mutation) => {
      if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
        updateGiscusTheme();
      }
    });
  });

  // Start observing after Giscus loads
  window.addEventListener('load', () => {
    const html = document.querySelector('html');
    observer.observe(html, { attributes: true });
    
    // Set initial theme once iframe is ready
    const checkIframe = setInterval(() => {
      const iframe = document.querySelector('iframe.giscus-frame');
      if (iframe) {
        clearInterval(checkIframe);
        // Small delay to ensure iframe is fully loaded
        setTimeout(updateGiscusTheme, 1000);
      }
    }, 100);
  });
</script>
